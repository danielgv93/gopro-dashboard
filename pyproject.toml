[project]
name = "gopro-daily"
version = "0.1.0"
description = "Web app that stitches GoPro chapters into one video per day, with an optional GPS/date overlay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "gopro-overlay>=0.129",
]

[project.scripts]
gopro-daily = "gopro_daily.server:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gopro_daily"]

[tool.pytest.ini_options]
testpaths = ["tests"]
